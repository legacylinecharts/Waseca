                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(player.stats.g, defMaxStats.g) ? '#FFFF00' : 'transparent' }}>{player.stats.g}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(player.stats.a, defMaxStats.a) ? '#FFFF00' : 'transparent' }}>{player.stats.a}</td>
                                  <td className="border text-center font-bold" style={{ padding, backgroundColor: isMaxStat(player.stats.pts, defMaxStats.pts) ? '#FFFF00' : 'transparent' }}>{player.stats.pts}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(player.stats.ppg, defMaxStats.ppg) ? '#FFFF00' : 'transparent' }}>{player.stats.ppg}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(player.stats.ppa, defMaxStats.ppa) ? '#FFFF00' : 'transparent' }}>{player.stats.ppa}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(player.stats.sh, defMaxStats.sh) ? '#FFFF00' : 'transparent' }}>{player.stats.sh}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(player.stats.sha, defMaxStats.sha) ? '#FFFF00' : 'transparent' }}>{player.stats.sha}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(player.stats.pim, defMaxStats.pim) ? '#FFFF00' : 'transparent' }}>{player.stats.pim}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>

                          <h3 className="font-bold mb-1 px-2 py-1 rounded text-xs" style={{ background: `${opponentColors.primary}20`, color: opponentLabelColor }}>
                            Goalies
                          </h3>
                          <table className="w-full border-collapse" style={{ fontSize }}>
                            <thead>
                              <tr className="bg-gray-200" style={{ fontSize: '10px', fontWeight: 'bold' }}>
                                <th className="border p-1" style={{ padding, width: '22px' }} onClick={() => toggleSort(goalieSort, setGoalieSort, 'num')}><span style={sortStyle(goalieSort,'num')}>#{ sortArrow(goalieSort,'num')}</span></th>
                                <th className="border p-1 text-left" style={{ padding, maxWidth: '90px', width: '90px' }}>Name</th>
                                <th className="border p-1" style={{ padding, width: '20px' }}>Gr</th>
                                <th className="border p-1" style={{ padding, width: '46px' }} onClick={() => toggleSort(goalieSort, setGoalieSort, 'min')}><span style={sortStyle(goalieSort,'min')}>MIN{sortArrow(goalieSort,'min')}</span></th>
                                <th className="border p-1" style={{ padding, width: '20px' }}>W</th>
                                <th className="border p-1" style={{ padding, width: '20px' }}>L</th>
                                <th className="border p-1" style={{ padding, width: '20px' }}>T</th>
                                <th className="border p-1" style={{ padding, width: '28px' }}>SOG</th>
                                <th className="border p-1" style={{ padding, width: '24px' }}>SV</th>
                                <th className="border p-1" style={{ padding, width: '22px' }}>GA</th>
                                <th className="border p-1" style={{ padding, width: '32px' }} onClick={() => toggleSort(goalieSort, setGoalieSort, 'gaa')}><span style={sortStyle(goalieSort,'gaa')}>GAA{sortArrow(goalieSort,'gaa')}</span></th>
                                <th className="border p-1" style={{ padding, width: '32px' }} onClick={() => toggleSort(goalieSort, setGoalieSort, 'svp')}><span style={sortStyle(goalieSort,'svp')}>SV%{sortArrow(goalieSort,'svp')}</span></th>
                                <th className="border p-1" style={{ padding, width: '20px' }}>SO</th>
                              </tr>
                            </thead>
                            <tbody>
                              {goalies.map((player, idx) => {
                                const gp = player.goalieStats?.gp || 0;
                                const minSecs = goalieMinToSecs(player);
                                const gaaVal = parseFloat(player.goalieStats?.gaa ?? 99);
                                const svpVal = parseFloat(player.goalieStats?.svp || '0') || 0;
                                const wVal = player.goalieStats?.w || 0;
                                const soVal = player.goalieStats?.so || 0;
                                return (
                                <tr key={player.id} className={idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                  <td className="border font-bold text-center" style={{ padding }}>{player.number}</td>
                                  <td className="border" style={{ padding, maxWidth: '100px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{player.firstName} {player.lastName}</td>
                                  <td className="border text-center" style={{ padding }}>{convertGradeToText(player.grade)}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: gp > 0 && minSecs > 0 && minSecs === gMin ? '#FFFF00' : 'transparent' }}>{player.goalieStats?.min || '0:00'}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(wVal, gW) ? '#FFFF00' : 'transparent' }}>{wVal}</td>
                                  <td className="border text-center" style={{ padding }}>{player.goalieStats?.l || 0}</td>
                                  <td className="border text-center" style={{ padding }}>{player.goalieStats?.t || 0}</td>
                                  <td className="border text-center" style={{ padding }}>{player.goalieStats?.sog || 0}</td>
                                  <td className="border text-center" style={{ padding }}>{player.goalieStats?.sv || 0}</td>
                                  <td className="border text-center" style={{ padding }}>{player.goalieStats?.ga || 0}</td>
                                  <td className="border text-center font-bold" style={{ padding, backgroundColor: gp > 0 && gGAA < 99 && gaaVal === gGAA ? '#FFFF00' : 'transparent' }}>{player.goalieStats?.gaa?.toFixed(2) ?? '0.00'}</td>
                                  <td className="border text-center font-bold" style={{ padding, backgroundColor: gp > 0 && svpVal > 0 && svpVal === gSVP ? '#FFFF00' : 'transparent' }}>{player.goalieStats?.svp || '.000'}</td>
                                  <td className="border text-center" style={{ padding, backgroundColor: isMaxStat(soVal, gSO) ? '#FFFF00' : 'transparent' }}>{soVal}</td>
                                </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    );
                  })()}
                </div>

                {/* Diagrams & Notes */}
                {(() => {
                  const layout = diagramImages.layout || '3uneven';

                  // Layout definitions: [colWidth%, ...] — spacers handled via gap
                  const layoutConfigs = {
                    '1col':      { cols: 1, widths: ['100%'],                        gap: '0%',   label: '1 Column' },
                    '2col':      { cols: 2, widths: ['48%','48%'],                   gap: '4%',   label: '2 Columns' },
                    '3even':     { cols: 3, widths: ['31%','31%','31%'],             gap: '3.5%', label: '3 Even' },
                    '3uneven':   { cols: 3, widths: ['48%','23%','23%'],             gap: '3%',   label: '3 Uneven' },
                    '4even':     { cols: 4, widths: ['23.5%','23.5%','23.5%','23.5%'], gap: '3%', label: '4 Even' },
                  };
                  const cfg = layoutConfigs[layout] || layoutConfigs['3uneven'];
                  const imgKeys  = ['image1','image2','image3','image4'];
                  const noteKeys = ['notes1','notes2','notes3','notes4'];

                  const DiagramCol = ({ imgKey, noteKey, width }) => {
                    const img = diagramImages[imgKey];
                    const note = diagramImages[noteKey] || '';
                    return (
                      <div style={{ width, position: 'relative', display: 'flex', flexDirection: 'column', minHeight: 0, flexShrink: 0 }}>
                        {img ? (
                          <div className="relative w-full flex-1 diagram-col-inner" style={{ minHeight: 0, overflow: 'hidden' }}>
                            <img src={img} alt="Diagram" style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block', backgroundColor: 'white' }} />
                            <button
                              onClick={() => setDiagramImages({...diagramImages, [imgKey]: null})}
                              className="no-print absolute top-0 right-0 bg-red-500 text-white text-xs px-2 py-1 rounded hover:bg-red-600"
                            >×</button>
                          </div>
                        ) : (
                          <div className="flex-1 flex flex-col bg-gray-50 rounded p-1 no-print">
                            <input
                              type="file"
                              accept="image/*"
                              className="no-print w-full text-xs mb-1"
                              onChange={async (e) => {
                                const file = e.target.files[0];
                                if (file) {
                                  try {
                                    const compressed = await compressImage(file);
                                    setDiagramImages({...diagramImages, [imgKey]: compressed});
                                  } catch(err) { alert('Error processing image.'); }
                                }
                              }}
                            />
                            <div
                              style={{ fontSize: '8px', lineHeight: '1.3', flex: 1 }}
                              className="text-gray-600 border border-gray-300 rounded p-1 bg-white"
                              contentEditable
                              suppressContentEditableWarning
                              onBlur={(e) => setDiagramImages({...diagramImages, [noteKey]: e.currentTarget.innerText})}
                              onPaste={async (e) => {
                                const items = e.clipboardData.items;
                                for (let i = 0; i < items.length; i++) {
                                  if (items[i].type.indexOf('image') !== -1) {
                                    e.preventDefault();
                                    const blob = items[i].getAsFile();
                                    try {
                                      const compressed = await compressImage(blob);
                                      setDiagramImages({...diagramImages, [imgKey]: compressed});
                                    } catch(err) {}
                                    break;
                                  }
                                }
                              }}
                              dangerouslySetInnerHTML={{ __html: note || (imgKey === 'image1' ? 'Paste image or notes...' : 'Paste...') }}
                            />
                          </div>
                        )}
                      </div>
                    );
                  };

                  return (
                    <div className="mt-2 diagram-section" style={{ display: 'flex', flexDirection: 'column', overflow: 'hidden', flex: 1, minHeight: 0 }}>
                      {/* Layout selector — no-print */}
                      <div className="no-print mb-1" style={{ display: 'flex', gap: '4px', flexWrap: 'wrap', alignItems: 'center' }}>
                        <span style={{ fontSize: '9px', color: '#666', marginRight: '2px' }}>Layout:</span>
                        {Object.entries(layoutConfigs).map(([key, val]) => (
                          <button
                            key={key}
                            onClick={() => setDiagramImages({...diagramImages, layout: key})}
                            style={{
                              fontSize: '8px',
                              padding: '1px 5px',
                              borderRadius: '3px',
                              border: '1px solid #ccc',
                              backgroundColor: layout === key ? '#374151' : '#f9fafb',
                              color: layout === key ? '#fff' : '#374151',
                              cursor: 'pointer',
                              fontWeight: layout === key ? 'bold' : 'normal'
                            }}
                          >{val.label}</button>
                        ))}
                      </div>
                      {/* Column area */}
                      <div style={{ display: 'flex', gap: cfg.gap, flexGrow: 1, minHeight: 0 }}>
                        {cfg.widths.map((w, i) => (
                          <DiagramCol key={i} imgKey={imgKeys[i]} noteKey={noteKeys[i]} width={w} />
                        ))}
                      </div>
                    </div>
                  );
                })()}


                                {/* Bottom: MSHSL Logo + Creator Credit — always pinned to bottom of page 2 */}
                <div style={{ flexShrink: 0, paddingBottom: '4pt' }}>
                  {/* MSHSL Boys Hockey Logo */}
                  <div style={{ textAlign: 'center', marginTop: '8px', marginBottom: '4px', display: 'flex', justifyContent: 'center' }}>
                    <img 
                      src="https://cdn2.sportngin.com/attachments/league/c4e7-208998629/MSHSLboyshockey_large_square.png" 
                      alt="MSHSL Boys Hockey" 
                      style={{ width: '0.75in', height: '0.75in', objectFit: 'contain', display: 'block', margin: '0 auto', backgroundColor: 'white' }}
                    />
                  </div>
                  
                  {/* Creator Credit - Page 2 */}
                  <div style={{ textAlign: 'center', fontSize: '10px', color: '#000000', marginTop: '4px', paddingTop: '2px', paddingBottom: '2px' }}>
                    Created exclusively for the {myTeamSetup.teamName} by Legacy Line Charts - legacylinecharts@gmail.com - © Legacy Line Charts
                  </div>
                </div>
              </div>

              {/* Print Styles */}
              <style>{`
                .print-only { display: none; }
                @media print {
                  .no-print {
                    display: none !important;
                  }
                  .print-only {
                    display: block !important;
                  }
                  
                  .placeholder-print-hide::placeholder {
                    color: transparent !important;
                  }
                  
                  body {
                    margin: 0;
                    padding: 0;
                  }
                  
                  .print-page-1, .print-page-2 {
                    page-break-after: always;
                    margin: 0 auto !important;
                    padding: 0.05in;
                    max-width: 7.875in !important;
                    width: 7.875in !important;
                    min-height: 10.375in;
                    max-height: 10.375in;
                    box-sizing: border-box !important;
                    overflow: hidden;
                    position: relative;
                    left: 0;
                    right: 0;
                  }
                  
                  .print-page-2 {
                    page-break-before: always;
                    page-break-after: avoid;
                    page-break-inside: avoid;
                    display: flex !important;
                    flex-direction: column !important;
                  }
                  
                  @page {
                    size: 8.5in 11in;
                    margin: 0.3125in;
                  }
                  
                  * {
                    box-sizing: border-box !important;
                  }
                  
                  .print-page-2 > div:last-child {
                    flex-shrink: 1;
                    overflow: hidden;
                  }

                  /* Diagram section — fills all remaining space above footer */
                  .print-page-2 {
                    height: 10.375in !important;
                  }

                  .print-page-2 .diagram-section {
                    flex: 1 1 0% !important;
                    min-height: 0 !important;
                    overflow: hidden !important;
                  }

                  .print-page-2 .diagram-section .diagram-col-inner {
                    position: absolute !important;
                    top: 0 !important; left: 0 !important;
                    right: 0 !important; bottom: 0 !important;
                    overflow: hidden !important;
                  }

                  .print-page-2 .diagram-section img {
                    width: 100% !important;
                    height: 100% !important;
                    object-fit: contain !important;
                    display: block !important;
                  }
                }
                
                .page-break {
                  page-break-before: always;
                }
              `}</style>
            </div>
          );
        };

        // Render with Error Boundary
        ReactDOM.render(
          <ErrorBoundary>
            <HockeyLinesChart />
          </ErrorBoundary>,
          document.getElementById('root')
        );
    </script>
</body>
</html>
